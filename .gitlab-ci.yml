finalize_release:
  stage: finalize
  tags:
    - android
  timeout: 10m
  resource_group: ruthenium-release-update
  needs:
    - publish_github_release_arm64
    - publish_github_release_armv7
    - publish_github_release_x86_64
  rules:
    - if: '$RUTHENIUM_SCHEDULE_TASK == "release_update"'
      when: on_success
      allow_failure: false
    - when: never
  script:
    - |
      # shellcheck shell=bash
      set -euo pipefail
      umask 077
      test "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH"
      EXPECTED_RELEASE_ID="$(
        python3 scripts/release_pipeline_state.py release-id \
          --root "$CI_PROJECT_DIR"
      )"
      if [ -n "${RUTHENIUM_RELEASE_ID:-}" ]; then
        test "$RUTHENIUM_RELEASE_ID" = "$EXPECTED_RELEASE_ID"
      fi
      test -n "${RUTHENIUM_GITLAB_RELEASE_TOKEN:-}"
      [[ "$RUTHENIUM_GITLAB_RELEASE_TOKEN" =~ ^[A-Za-z0-9_.-]{20,256}$ ]]
      FINALIZE_DIR="$(mktemp -d "$CI_PROJECT_DIR/.release-finalize.XXXXXX")"
      FINALIZE_CONFIG="$FINALIZE_DIR/api.curl"
      cleanup_finalize() {
        if [ -f "$FINALIZE_CONFIG" ]; then
          shred -u -- "$FINALIZE_CONFIG"
        fi
        find "$FINALIZE_DIR" -depth -delete 2>/dev/null || true
      }
      trap cleanup_finalize EXIT
      printf 'header = "PRIVATE-TOKEN: %s"\n' \
        "$RUTHENIUM_GITLAB_RELEASE_TOKEN" > "$FINALIZE_CONFIG"
      unset RUTHENIUM_GITLAB_RELEASE_TOKEN
      chmod 0600 "$FINALIZE_CONFIG"
      mkdir -p "$CI_PROJECT_DIR/finalize-artifacts"
      python3 scripts/release_pipeline_state.py mark \
        --api-url "$CI_API_V4_URL" \
        --project-id "$CI_PROJECT_ID" \
        --curl-config "$FINALIZE_CONFIG" \
        --pipeline-id "$CI_PIPELINE_ID" \
        --commit-sha "$CI_COMMIT_SHA" \
        --release-id "$EXPECTED_RELEASE_ID" \
        --output "$CI_PROJECT_DIR/finalize-artifacts/release-marker.json"
  artifacts:
    name: "release-finalized-${CHROMIUM_VERSION}"
    paths:
      - finalize-artifacts/
    expire_in: 90 days
    when: always
